<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Pageturn — library</title>
  <style>
    :root { color-scheme: light dark; }
    body { font: 15px/1.5 system-ui, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 20px; }
    h1 { font-size: 20px; }
    button { font: inherit; padding: 5px 10px; border: 1px solid #8886; border-radius: 6px;
      background: none; color: inherit; cursor: pointer; margin-right: 6px; }
    #drop { border: 2px dashed #8886; border-radius: 10px; padding: 26px; text-align: center; opacity: .8; }
    #status { min-height: 1.4em; opacity: .8; }
    /* Cover shelf: uniform grid */
    #shelf { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 20px 16px; margin-top: 14px; }
    .card { text-align: left; }
    .art { position: relative; aspect-ratio: 2/3; border-radius: 8px; overflow: hidden;
      background: linear-gradient(145deg, #8a8a8a22, #8a8a8a11);
      box-shadow: 0 3px 10px #0004; display: grid; place-items: center; cursor: pointer; }
    .art img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .art .ph { padding: 10px; font-size: 12px; line-height: 1.35; opacity: .65; text-align: center;
      overflow: hidden; display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; }
    .card.active .art { outline: 2px solid #c0392b; outline-offset: 2px; }
    .card h3 { margin: 8px 0 2px; font-size: 13px; font-weight: 600; line-height: 1.3;
      overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
    .card small { opacity: .6; font-size: 11px; }
    .card .acts { margin-top: 6px; display: flex; gap: 4px; }
    .card .acts button { font-size: 11px; padding: 3px 7px; margin: 0; }
    /* Tabs keep every feature one click away instead of one long scroll. */
    #tabs { display: flex; gap: 4px; border-bottom: 1px solid #8883; margin: 18px 0 0; }
    #tabs button { border: none; border-radius: 6px 6px 0 0; margin: 0; padding: 8px 14px;
      opacity: .6; }
    #tabs button.on { opacity: 1; background: #8882; font-weight: 600; }
    section[data-panel] { padding-top: 16px; }
    .hint { opacity: .7; font-size: 13px; line-height: 1.5; }
    .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    .row input[type=text] { font: inherit; padding: 6px 8px; flex: 1; min-width: 180px; }
    .site { display: flex; align-items: center; gap: 8px; padding: 7px 10px; margin: 6px 0;
      border: 1px solid #8883; border-radius: 7px; }
    .site span { flex: 1; }
    .site button { margin: 0; padding: 3px 9px; font-size: 12px; }
  </style>
</head>
<body>
  <h1>Your reading library</h1>
  <nav id="tabs">
    <button data-tab="library" class="on">Library</button>
    <button data-tab="focus">Focus</button>
    <button data-tab="data">Data</button>
  </nav>

  <section data-panel="library">
    <p class="hint">The active book is what you read before a blocked site opens.</p>
    <div id="drop">
      Drop a <b>.pdf</b>, <b>.epub</b>, or <b>.txt</b> here, or
      <input type="file" id="file" accept=".pdf,.epub,.txt,text/plain,application/pdf,application/epub+zip">
    </div>
    <p id="status"></p>
    <div id="shelf"></div>
  </section>

  <section data-panel="focus" hidden>
    <p class="hint">YouTube always sends you to your book first. Add any other site to do the same.</p>
    <div class="row">
      <input id="siteInput" type="text" placeholder="instagram.com">
      <button id="siteAdd">Add site</button>
    </div>
    <p id="siteStatus" class="hint"></p>
    <div id="siteList"></div>

  </section>

  <section data-panel="data" hidden>
    <p class="hint">Everything lives only in this browser. Back it up before reinstalling —
      there is no cloud copy.</p>
    <div class="row">
      <button id="exportAll">⬇ Export backup</button>
      <button id="importBtn">⬆ Restore backup</button>
      <input type="file" id="importFile" accept="application/json,.json" hidden>
    </div>
    <p id="dataStatus" class="hint"></p>
  </section>

  <script type="module" src="library.js"></script>
</body>
</html>
